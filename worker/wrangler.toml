name = "danichi-finance-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ─── D1 Database ───────────────────────────────────────────────────────────────
# After running `npm run db:create`, paste the database_id here
[[d1_databases]]
binding = "DB"
database_name = "danichi-finance"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ─── Environment Variables ─────────────────────────────────────────────────────
[vars]
# Set this to your Cloudflare Pages URL after you deploy the frontend
# e.g. https://danichi-finance.pages.dev
CORS_ORIGIN = "http://localhost:5173"

# ─── Local Dev Overrides ───────────────────────────────────────────────────────
[env.dev.vars]
CORS_ORIGIN = "http://localhost:5173,http://localhost:5174,http://localhost:4173"
